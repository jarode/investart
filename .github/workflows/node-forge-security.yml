name: Verify node-forge security update
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/node-forge-security.yml
  workflow_dispatch:
jobs:
  security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Check patched lockfile
        run: |
          node -e "const l=require('./package-lock.json'); const v=l.packages?.['node_modules/node-forge']?.version || l.dependencies?.['node-forge']?.version; if (v !== '1.3.2') { console.error('Unexpected node-forge version:',v); process.exit(1) }"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check installed node-forge
        run: node -e "const v=require('node-forge/package.json').version; if (v !== '1.3.2') { console.error('Installed node-forge:',v); process.exit(1) }"
      - name: Run project build or smoke test
        run: npm run production
        env:
          CI: 'true'
          NODE_OPTIONS: --openssl-legacy-provider
